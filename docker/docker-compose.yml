services:
  newsnow:
    image: ghcr.io/ourongxing/newsnow:latest
    container_name: trendradar-newsnow
    restart: unless-stopped
    expose:
      - "4444"
    volumes:
      - newsnow-data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      - G_CLIENT_ID=
      - G_CLIENT_SECRET=
      - JWT_SECRET=
      - PRODUCTHUNT_API_TOKEN=

  ollama:
    image: ollama/ollama:0.40.4
    container_name: trendradar-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:0.40.4
    container_name: trendradar-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}"]

  trendradar:
    image: trendradarht:ollama-timeout-fix
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: trendradar
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      newsnow:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

    ports:
      - "${WEBSERVER_PORT:-8080}:${WEBSERVER_PORT:-8080}"

    volumes:
      - ../output:/app/output

    environment:
      - TZ=Asia/Ho_Chi_Minh
      # Web 服务器
      - WEBSERVER_PORT=${WEBSERVER_PORT:-8080}
      - PLATFORMS_API_URL=${PLATFORMS_API_URL:-http://newsnow:4444/api/s}
      # 通知渠道
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_TOKEN_FILE=${TELEGRAM_BOT_TOKEN_FILE:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_CHAT_ID_FILE=${TELEGRAM_CHAT_ID_FILE:-}
      - DINGTALK_WEBHOOK_URL=${DINGTALK_WEBHOOK_URL:-}
      - WEWORK_WEBHOOK_URL=${WEWORK_WEBHOOK_URL:-}
      - WEWORK_MSG_TYPE=${WEWORK_MSG_TYPE:-}
      # 邮件配置
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_PASSWORD_FILE=${EMAIL_PASSWORD_FILE:-}
      - EMAIL_TO=${EMAIL_TO:-}
      - EMAIL_SMTP_SERVER=${EMAIL_SMTP_SERVER:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-}
      # ntfy配置
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NTFY_TOKEN_FILE=${NTFY_TOKEN_FILE:-}
      # Bark配置
      - BARK_URL=${BARK_URL:-}
      # Slack配置
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # 通用Webhook配置
      - GENERIC_WEBHOOK_URL=${GENERIC_WEBHOOK_URL:-}
      - GENERIC_WEBHOOK_TEMPLATE=${GENERIC_WEBHOOK_TEMPLATE:-}
      # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
      - AI_ANALYSIS_ENABLED=${AI_ANALYSIS_ENABLED:-true}
      - AI_API_KEY=${AI_API_KEY:-ollama}
      - AI_API_KEY_FILE=${AI_API_KEY_FILE:-}
      - AI_MODEL=${AI_MODEL:-ollama/qwen2.5:3b}
      - AI_API_BASE=${AI_API_BASE:-http://ollama:11434}
      # 远程存储配置（S3 兼容协议）
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_ACCESS_KEY_ID_FILE=${S3_ACCESS_KEY_ID_FILE:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_SECRET_ACCESS_KEY_FILE=${S3_SECRET_ACCESS_KEY_FILE:-}
      - S3_REGION=${S3_REGION:-}
      # 运行模式
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/30 * * * *}
      - RUN_MODE=${RUN_MODE:-cron}
      - IMMEDIATE_RUN=${IMMEDIATE_RUN:-true}


volumes:
  newsnow-data:
    name: trendradar_newsnow_data
  ollama-data:
    name: trendradar_ollama_data
